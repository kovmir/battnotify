name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            git \
            libnotify-dev

      - name: Build
        run: make

      - name: Build unit tests
        run: make test

      - name: Run unit tests
        run: ./battery_test
